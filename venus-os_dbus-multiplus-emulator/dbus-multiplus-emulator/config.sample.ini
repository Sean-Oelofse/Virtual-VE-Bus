; CONFIG FILE
; GitHub repository: https://github.com/sean-oelofse/virtual-ve-bus
; remove the semicolon ; to enable a setting
;
; NOTE: This file is now actually read by the driver. Copy it to "config.ini"
; (the install script does this for you on first install) and edit that copy.

[DEFAULT]
; Set logging level
; ERROR = shows errors only
; WARNING = shows ERROR and warnings
; INFO = shows WARNING and running functions
; DEBUG = shows INFO and data/values
; default: WARNING
logging = WARNING

; Device name shown in the GUI
; default: MultiPlus-II xx/5000/xx-xx (emulated)
device_name = MultiPlus-II xx/5000/xx-xx (emulated)

; uncomment or change the phase combination you are using
; default: L1
phase_used = L1
; phase_used = L1, L2
; phase_used = L1, L2, L3

; enter the maximum power of the inverter of a single phase
inverter_max_power = 4500

; enter the dbus service name from which the battery data should be fetched, if there is more than one
; e.g. com.victronenergy.battery.mqtt_battery_41
dbus_service_name_battery =

; enter the dbus service name from which the grid meter data should be fetched, if there is more than one
; e.g. com.victronenergy.grid.mqtt_grid_31
dbus_service_name_grid =

; if there is more then one phase, the emulator can only divide the DC power equally to all AC phases
; since in reality this is rarely the case, it's possible to set an ac load meter which provides the power of each inverter per phase
; enter the dbus service name from which the ac load meter data should be fetched, if there is more than one
; e.g. com.victronenergy.acload.mqtt_acload_31
dbus_service_name_ac_load =

; enter the dbus service name from which the PV inverter data should be fetched, if there is more than one
; e.g. com.victronenergy.pvinverter.mqtt_pvinverter_61
dbus_service_name_pv_inverter =

; enter grid frequency
; used if the grid meter is not available or does not provide the frequency
; Europe
grid_frequency = 50
; UK/USA
; grid_frequency = 60

; enter grid nominal voltage
; used if the grid meter is not available or does not provide the voltage
; Europe
grid_nominal_voltage = 230
; UK/USA
; grid_nominal_voltage = 120


; ------------------------------------------------------------------
; MQTT INPUT (optional)
; ------------------------------------------------------------------
; When enabled, the emulator connects to an MQTT broker and lets you push
; values straight into it - no separate dbus-mqtt-* drivers needed.
;
; It subscribes to:
;   <mqtt_base_topic>/set        -> a full JSON document, e.g.
;                                   {"battery":{"soc":80,"power":-1200,"voltage":52.1},
;                                    "grid":{"power":300},
;                                    "acload":{"power":450},
;                                    "pvinverter":{"power":0}}
;   <mqtt_base_topic>/set/#      -> a single value, e.g.
;                                   topic  veemu/set/battery/soc   payload  80
;                                   topic  veemu/set/grid/power    payload  300
;                                   topic  veemu/set/grid/L1/power payload  120
;
; It publishes the current state to:
;   <mqtt_base_topic>/state      -> retained JSON with battery/acout/gridin
;
; Recognised battery keys : soc, power, current, voltage, temperature
; Recognised meter keys   : power, current, voltage, frequency
;   (grid / acload / pvinverter, optionally nested under L1 / L2 / L3)

; enable the built-in MQTT client (default: False)
mqtt_enabled = False

; broker address and port (127.0.0.1 = the broker running on the Venus OS device)
mqtt_address = 127.0.0.1
mqtt_port = 1883

; leave empty if the broker does not require authentication
mqtt_username =
mqtt_password =

; base topic used for the /set and /state topics above
mqtt_base_topic = veemu
